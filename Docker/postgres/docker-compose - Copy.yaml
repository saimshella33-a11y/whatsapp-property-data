services:
  evolution-postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution-redis:
    image: redis:latest
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evolution-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@evolution-postgres:5432/evolution?schema=evolution_api
      - REDIS_URI=redis://evolution-redis:6379
      - AUTHENTICATION_API_KEY=B6D711FCDD9FFA8D8A0F5B4D9B6A9D6C
    depends_on:
      - evolution-postgres
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net

    evolution-frontend:
    image: evoapicloud/evolution-manager:v2.1.1
    container_name: evolution_frontend
    restart: always
    entrypoint: /bin/sh
    command: >
      -c "
      if [ -f /etc/nginx/conf.d/nginx.conf ]; then
        sed -i 's/ must-revalidate//g' /etc/nginx/conf.d/nginx.conf;
      fi &&
      nginx -g 'daemon off;'
      "
    ports:
      - "3000:80"
    environment:
      - API_URL=http://evolution-api:8080
    depends_on:
      - evolution-api
    networks:
      - evolution-net

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge