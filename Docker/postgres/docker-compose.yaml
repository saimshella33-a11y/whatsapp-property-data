version: '3.7'

services:
  evolution-postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: always
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution-redis:
    image: redis:latest
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evolution-net

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - N8N_ENABLED=true
    env_file:
      - .env
    depends_on:
      - evolution-postgres
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net

  evolution-frontend:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution_frontend
    restart: always
    entrypoint: ["npx", "serve", "-s", "dist", "-l", "80"]
    ports:
      - "3000:80"
    environment:
      - API_URL=http://localhost:8080
    depends_on:
      - evolution-api
    networks:
      - evolution-net

volumes:
  - ./nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge